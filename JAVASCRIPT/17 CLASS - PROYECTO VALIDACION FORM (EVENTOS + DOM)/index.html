<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <title>EJERCICIO DOM</title>
</head>
<body>
    <h1>ejercicio dom, eventos y funciones</h1>
    <p>

<div class="box">
    <form action="" method="POST" id="formulario" onsubmit="return false;">
        <label for="nombre">Nombre:</label> <br/>
        <input type="text" id="nombre" name="nombre"/><br/>
        <span id="error_nombre"></span><br/>

        <label for="apellidos">Apellidos:</label><br/>
        <input type="text" id="apellidos" name="apellidos"/><br/>
        <span id="error_apellidos"></span><br/>

        <label for="edad">Edad:</label><br/>
        <input type="number" id="edad" name="edad"/><br/>
        <span id="error_edad"></span><br/>

        <input type="submit" value="enviar" id="submit"/>
    </form>
</div>

<div class="box dashed">
    <h3>Información del usuario</h3>
    <hr>    
    <p id="p_nombre">
        Nombre: <span></span>
    </p>

    <p id="p_apellidos">
        Apellidos: <span></span>
    </p>

    <p id="p_edad">
        Edad: <span></span>
    </p>
</div>
</p>
</body>
</html>
