<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiosco Cierva — oferta relámpago (solución)</title>
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/script.js"></script>
  </head>
  <body>
    <h1>Kiosco Cierva</h1>
    <p>
      Oferta relámpago:
      <span id="cuentaAtras">---</span>
    </p>
    <button id="btnReiniciarOferta">Reiniciar oferta</button>

    <h2>Tu pedido</h2>
    <p>Nombre:</p>
    <input type="text" id="nombreAlumno" />

    <p>Precio del artículo (€, entero):</p>
    <input type="text" id="precioArticulo" />

    <p>Cantidad (entero):</p>
    <input type="text" id="cantidad" />

    <p>
      <button id="btnCalcular">Calcular pedido</button>
    </p>

    <h3 id="saludo">Escribe tu nombre para saludarte</h3>
    <div id="resultado"></div>
  </body>
</html>
